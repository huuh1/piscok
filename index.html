<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Utama</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            text-align: center;
        }
        header {
            background-color: #4CAF50;
            color: white;
            padding: 20px 0;
        }
        main {
            padding: 40px 20px;
        }
        footer {
            background-color: #333;
            color: white;
            padding: 10px 0;
            position: fixed;
            width: 100%;
            bottom: 0;
        }
        a {
            color: #4CAF50;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>Selamat Datang di Website Saya</h1>
    </header>

    <main>
        <h2>Halo!</h2>
        <p>Ini adalah halaman HTML dasar dengan header, konten, dan footer.</p>
        <p>Pelajari lebih lanjut tentang <a href="https://www.w3schools.com/html/">HTML di sini</a>.</p>
    </main>

    <footer>
        &copy; 2026 Website Saya. Semua hak dilindungi.
    </footer>

</body>
</html>
